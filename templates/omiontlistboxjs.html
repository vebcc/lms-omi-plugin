{literal}
<script type="text/javascript">
    /**
     * Panel listy ONU z OltManagera. Dane pobierane przez proxy LMS (?m=omiapiproxy) -
     * token OltManagera nie opuszcza serwera. Dane z OltManagera trafiają do DOM wyłącznie
     * jako tekst (.text() / text node) albo przez omiEscapeHtml().
     */

    function omiEscapeHtml(value) {
        return String(value === null || value === undefined ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function omiInitOnuPanel(config, objectId) {
        var filters = {
            customer: 'ownerLmsId',
            device: 'deviceLmsId',
            networkdevice: 'networkDeviceLmsId'
        };
        var endpoint = 'api/v1/onu/' + (config.onuLinkParams || '?');

        if (config.section !== 'ticket') {
            if (!filters[config.section] || !objectId || !/^\d+$/.test(objectId)) {
                console.error('[OMI] Brak poprawnego ID dla sekcji ' + config.section);
                return;
            }
            endpoint += '&' + filters[config.section] + '=' + encodeURIComponent(objectId);
        }

        omiFetchOnus(config, endpoint);
        omiBindActions(config);
    }

    function omiProxyUrl(config, params) {
        var separator = config.proxyUrl.indexOf('?') === -1 ? '?' : '&';
        return config.proxyUrl + separator + $.param(params);
    }

    function omiFetchOnus(config, apiEndpoint) {
        $.ajax({
            method: 'GET',
            url: omiProxyUrl(config, {endpoint: apiEndpoint}),
            dataType: 'json',
            success: function (data) {
                omiRenderOnus(config, data);
            },
            error: function (xhr, status) {
                if (xhr.status === 404) {
                    omiAppendMessage('Brak dopisanych urządzeń ONU.');
                } else {
                    console.log('[OMI proxy] status:', status, 'http:', xhr.status);
                }
            }
        });
    }

    function omiAppendMessage(message) {
        $('div#super-omi-table').append(
            '<div class="lms-ui-tab-table-row"><span style="font-size: larger">' + omiEscapeHtml(message) + '</span></div>'
        );
    }

    function omiField(object, path) {
        var value = object;
        for (var i = 0; i < path.length; i++) {
            if (value === null || typeof value !== 'object' || !(path[i] in value)) {
                return null;
            }
            value = value[path[i]];
        }
        return value;
    }

    function omiStatus(element, key) {
        var cause = omiField(element, [key, 'cause']);
        if (!cause || !cause.level) {
            return {name: '', level: '', datetime: ''};
        }
        return {
            name: cause.value || '',
            level: /^\d+$/.test(String(cause.level)) ? String(cause.level) : '',
            datetime: omiField(element, [key, 'datetime']) || ''
        };
    }

    function omiSignal(value) {
        var number = parseFloat(value);
        return isNaN(number) ? null : number;
    }

    function omiColumn(cssClass) {
        return $('<div></div>').addClass('lms-ui-tab-table-column ' + cssClass);
    }

    function omiWrapper(cssClass) {
        return $('<div></div>').addClass('lms-ui-tab-table-wrapper ' + cssClass);
    }

    function omiTargetUrl(config, onuId) {
        // Przez moduł LMS (przekierowanie + ewentualne SSO), gdy włączone autologowanie lub nowa karta.
        if (config.newTab || config.autoLogin) {
            return omiProxyUrl(config, {endpoint: 'onu/' + onuId, redirect: 1});
        }
        return config.oltManagerUrl + '/onu/' + onuId;
    }

    function omiSignalSpan(cssClass, value, alarmThreshold) {
        var span = $('<span class="signal-color-general"></span>').addClass(cssClass);
        if (value === null) {
            span.text('Brak');
            if (alarmThreshold) {
                span.css('color', 'red');
            }
            return span;
        }
        span.text(value.toFixed(2));
        if (alarmThreshold) {
            span.css('color', value < parseFloat(alarmThreshold) ? 'red' : 'green');
        }
        return $('<span></span>').append(span).append(document.createTextNode('(dbi)'));
    }

    function omiRenderOnus(config, result) {
        if (!result || !result.data) {
            return;
        }

        var onus = Array.isArray(result.data) ? result.data : Object.values(result.data);
        var table = $('div#super-omi-table');
        var configuration = result.configuration || {};

        $('span.onu-counter-span').text(onus.length);

        if (onus.length === 0) {
            omiAppendMessage('Brak dopisanych urządzeń ONU!');
            return;
        }

        onus.forEach(function (element) {
            if (!element || !/^\d+$/.test(String(element.id))) {
                return;
            }
            var onuId = String(element.id);
            var type = omiField(element, ['type', 'id']) ? omiField(element, ['type', 'name']) : '';
            var typeReported = omiField(element, ['typeReported', 'id']) ? omiField(element, ['typeReported', 'name']) : type;
            var physical = omiStatus(element, 'lastOnuBasicPhysicalStatus');
            var online = omiStatus(element, 'lastOnuBasicOnlineStatus');
            var signalOnu = omiSignal(omiField(element, ['lastOnuSignal', 'downOnuRx']));
            var signalOlt = omiSignal(omiField(element, ['lastOnuSignal', 'upOltRx']));

            var locationParts = [];
            ['city', 'street', 'house'].forEach(function (key) {
                var part = omiField(element, ['locationAddress', key]);
                if (part) {
                    locationParts.push(part);
                }
            });

            var row = $('<div class="lms-ui-tab-table-row om-ui-button"></div>')
                .attr('data-target-om-url', omiTargetUrl(config, onuId));
            if (config.newTab) {
                row.attr('data-newtab', '1');
            }

            var main = omiWrapper('col-5');

            var col1 = omiWrapper('col-2');
            col1.append(omiColumn('name')
                .append($('<strong></strong>').text(element.address || ''))
                .append('<br>')
                .append(document.createTextNode(locationParts.join(' '))));
            col1.append(omiColumn('description')
                .append(document.createTextNode(element.mac || ''))
                .append('<br>')
                .append(document.createTextNode(element.serial ? '(' + element.serial + ')' : '')));
            main.append(col1);

            main.append(omiColumn('id').text(typeReported || ''));

            var col3 = omiWrapper('col-2');
            col3.append(omiColumn('id')
                .append($('<span class="status-color-general"></span>')
                    .addClass(physical.level !== '' ? 'status-color-level-' + physical.level : '')
                    .text(physical.name))
                .append(document.createTextNode(' (' + omiTimeAgo(new Date(Date.parse(physical.datetime))) + ')'))
                .append('<br>')
                .append($('<span class="status-color-general"></span>')
                    .addClass(online.level !== '' ? 'status-color-level-' + online.level : '')
                    .text(online.name)));
            col3.append(omiColumn('id')
                .append(omiSignalSpan('onu-signal-value', signalOnu, configuration.signal_value_to_alarm))
                .append('<br>')
                .append(omiSignalSpan('olt-signal-value', signalOlt, configuration.olt_signal_value_to_alarm)));
            main.append(col3);

            var functions = omiColumn('id');
            var functionList = element.functions && typeof element.functions === 'object' ? Object.values(element.functions) : [];
            var buttons = 0;
            if (config.canRunActions) {
                functionList.forEach(function (func) {
                    if (!func || typeof func.url !== 'string' || !func.name) {
                        return;
                    }
                    functions.append($('<button type="button" class="onu-func-btn"></button>')
                        .attr('data-action-endpoint', func.url.replace(/^\/+/, ''))
                        .attr('data-name', String(func.name))
                        .text(String(func.name)))
                        .append(document.createTextNode(' '));
                    buttons++;
                });
            }
            if (buttons === 0) {
                functions.text('Brak');
            }
            main.append(functions);

            row.append(main);
            table.append(row);
        });
    }

    function omiBindActions(config) {
        $(document).on('click', '.onu-func-btn', function (e) {
            e.preventDefault();
            e.stopPropagation();
            var actionEndpoint = $(this).attr('data-action-endpoint');
            var name = $(this).attr('data-name');

            omiShowConfirm('Czy na pewno chcesz uruchomić funkcję: ' + name + '?', function () {
                fetch(config.actionUrl, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                        'X-OMI-CSRF-Token': config.csrfToken
                    },
                    body: $.param({endpoint: actionEndpoint})
                })
                    .then(function (resp) {
                        return resp.json().catch(function () {
                            return {};
                        });
                    })
                    .then(function (data) {
                        if (data && data.result === 'success') {
                            omiShowInfo('Sukces', 'Funkcja "' + name + '" wykonana poprawnie');
                        } else if (data && typeof data.error === 'string') {
                            omiShowInfo('Błąd', 'Błąd przy wykonywaniu "' + name + '": ' + data.error);
                        } else {
                            omiShowInfo('Błąd', 'Błąd przy wykonywaniu "' + name + '"');
                        }
                    })
                    .catch(function () {
                        omiShowInfo('Błąd sieci', 'Nie udało się połączyć z serwerem LMS');
                    });
            });
        });

        $(document).on('click', '.om-ui-button', function (e) {
            if ($(e.target).closest('.onu-func-btn').length) {
                return;
            }
            var url = $(this).attr('data-target-om-url');
            if (!url) {
                return;
            }
            if ($(this).attr('data-newtab')) {
                window.open(url, '_blank', 'noopener');
            } else {
                window.location.href = url;
            }
        });
    }

    function omiShowConfirm(message, onConfirm) {
        var overlay = document.getElementById('lmsConfirmModal');
        var btnOk = document.getElementById('lmsConfirmOk');
        var btnCancel = document.getElementById('lmsConfirmCancel');

        document.getElementById('lmsConfirmMessage').textContent = message;
        overlay.style.display = 'flex';

        function cleanup() {
            overlay.style.display = 'none';
            btnOk.removeEventListener('click', okHandler);
            btnCancel.removeEventListener('click', cleanup);
        }

        function okHandler() {
            cleanup();
            onConfirm();
        }

        btnOk.addEventListener('click', okHandler);
        btnCancel.addEventListener('click', cleanup);
    }

    function omiShowInfo(title, message) {
        var overlay = document.getElementById('lmsInfoModal');
        var btnOk = document.getElementById('lmsInfoOk');

        document.getElementById('lmsInfoHeader').textContent = title;
        document.getElementById('lmsInfoMessage').textContent = message;
        overlay.style.display = 'flex';

        function cleanup() {
            overlay.style.display = 'none';
            btnOk.removeEventListener('click', cleanup);
        }

        btnOk.addEventListener('click', cleanup);
    }

    function omiTimeAgo(date) {
        if (isNaN(date.getTime())) {
            return '-';
        }
        var seconds = Math.floor((new Date() - date) / 1000);

        var interval = Math.floor(seconds / 31536000);
        if (interval > 1) {
            return interval + ' lat temu';
        }
        interval = Math.floor(seconds / 2592000);
        if (interval > 4) {
            return interval + ' miesięcy temu';
        }
        if (interval > 1) {
            return interval + ' miesiące temu';
        }
        interval = Math.floor(seconds / 86400);
        if (interval > 1) {
            return interval + ' dni temu';
        }
        interval = Math.floor(seconds / 3600);
        if (interval > 1) {
            return interval + ' godzin temu';
        }
        interval = Math.floor(seconds / 60);
        if (interval > 1) {
            return interval + ' minut temu';
        }
        if (seconds < 10) {
            return 'teraz';
        }
        return Math.floor(seconds) + ' sekund temu';
    }
</script>
